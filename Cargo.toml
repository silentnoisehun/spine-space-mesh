[package]
name = "spine-space-mesh"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "spine-space-mesh"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }
